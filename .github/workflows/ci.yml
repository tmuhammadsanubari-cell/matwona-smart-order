name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matwona
          POSTGRES_PASSWORD: matwona
          POSTGRES_DB: matwona_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matwona" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://matwona:matwona@localhost:5432/matwona_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  reco:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reco
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
